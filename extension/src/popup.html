<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>回放增强</title>
<style>
  :root{
    --bg:#10131a; --panel:#171b24; --panel2:#1f2430; --line:#2a3140;
    --fg:#e6e9ef; --dim:#98a2b3; --acc:#4c8dff; --ok:#37c98b; --warn:#f0b429; --bad:#f2545b;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{
    width:392px; margin:0; padding:12px; background:var(--bg); color:var(--fg);
    font:13px/1.5 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif;
  }
  h1{font-size:13px;margin:0;letter-spacing:.3px}
  h1 span{color:var(--dim);font-weight:400}
  .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--dim)}
  .pill.ok{color:var(--ok);border-color:#1e4d3a;background:#10241b}
  .pill.bad{color:var(--bad);border-color:#4d1e22;background:#241012}
  .pill.warn{color:var(--warn);border-color:#4d3d1e;background:#241f10}

  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
  .row{display:flex;gap:8px;align-items:baseline;margin:2px 0}
  .k{color:var(--dim);font-size:11px;min-width:64px;flex:none}
  .v{font-family:var(--mono);font-size:11px;word-break:break-all;color:#cfd6e4}

  .item{display:flex;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}
  .item:first-of-type{border-top:none}
  .item .u{flex:1;font-family:var(--mono);font-size:11px;color:#cfd6e4;word-break:break-all;max-height:34px;overflow:hidden}
  .btn{
    border:1px solid var(--line);background:var(--panel2);color:var(--fg);border-radius:7px;
    padding:4px 9px;font-size:11px;cursor:pointer;white-space:nowrap
  }
  .btn:hover{border-color:#3b465a}
  .btn.primary{background:var(--acc);border-color:var(--acc);color:#fff}
  .btn:disabled{opacity:.45;cursor:default}
  .bar{display:flex;gap:8px;flex-wrap:wrap}
  .empty{color:var(--dim);font-size:12px;padding:8px 0}
  .hint{color:var(--dim);font-size:11px;line-height:1.6}
  .hint code{font-family:var(--mono);background:var(--panel2);padding:1px 4px;border-radius:4px}
  .sect{font-size:11px;color:var(--dim);margin:0 0 6px;letter-spacing:.4px;text-transform:uppercase}
  details summary{cursor:pointer;color:var(--dim);font-size:11px}
  pre{font-family:var(--mono);font-size:10px;background:#0c0f15;border:1px solid var(--line);
      border-radius:8px;padding:8px;max-height:180px;overflow:auto;margin:8px 0 0;color:#b9c2d0}
</style>
</head>
<body>
  <div class="head">
    <h1>回放增强 <span>v0.1</span></h1>
    <div class="pill" id="tokenPill">登录态检测中…</div>
  </div>

  <div class="card" id="pageCard">
    <p class="sect">当前页面</p>
    <div class="row"><span class="k">标题</span><span class="v" id="pgTitle">—</span></div>
    <div class="row"><span class="k">地址</span><span class="v" id="pgHref">—</span></div>
    <div class="row"><span class="k">播放器</span><span class="v" id="pgVideo">—</span></div>
  </div>

  <div class="card">
    <p class="sect">嗅到的视频直链</p>
    <div id="mediaList"><div class="empty">尚未嗅到。请在回放页点一下播放，再回来。</div></div>
  </div>

  <div class="bar" style="margin-bottom:10px">
    <button class="btn primary" id="openBtn" disabled>用增强播放器打开</button>
    <button class="btn" id="rescanBtn">重新扫描</button>
    <button class="btn" id="diagBtn">导出诊断</button>
  </div>

  <details>
    <summary>接口路径（诊断用，共 <span id="apiCount">0</span> 条）</summary>
    <div id="apiList"></div>
  </details>

  <p class="hint" style="margin-top:10px">
    需要登录？先在 <code>dm.sufe.edu.cn</code> 正常登录一次，本扩展只读取你自己浏览器里的
    会话，不保存密码、不联网上传。
  </p>

  <script src="popup.js"></script>
</body>
</html>
