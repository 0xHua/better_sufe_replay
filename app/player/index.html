<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>回放 · 空中课堂</title>
<link rel="icon" href="../icon-48.png">
<link rel="stylesheet" href="player.css">
</head>
<body>
<div class="app" id="app">

  <div class="stage" id="stage">
    <header class="bar">
      <a class="back" href="../index.html" title="返回课程列表">←</a>
      <span class="name" id="title">回放</span>
      <span class="meta" id="subtitle"></span>
      <span class="spacer"></span>
      <button class="tbtn" id="dlBtn1" title="下载第一路 MP4">下载①</button>
      <button class="tbtn" id="dlBtn2" title="下载第二路 MP4" hidden>下载②</button>
      <button class="tbtn on" id="sideBtn" title="侧栏：概要 / 知识要点 / PPT / 字幕">侧栏</button>
      <button class="tbtn" id="themeBtn" title="深浅色">深色</button>
    </header>

    <div class="vwrap" id="vwrap" data-mode="side" data-count="1">
      <div class="cell" id="cell1">
        <video id="v1" preload="metadata" playsinline></video>
        <span class="tag" id="tag1">① 屏幕</span>
        <div class="overlay" id="ov1"><span id="ovtext1">正在读取画面…</span></div>
      </div>
      <div class="cell" id="cell2" hidden>
        <video id="v2" preload="metadata" playsinline muted></video>
        <span class="tag" id="tag2">② 教师</span>
        <div class="overlay" id="ov2"><span id="ovtext2">正在读取画面…</span></div>
      </div>
      <div class="wm" id="wm"></div>
    </div>

    <footer class="ctrl">
      <div class="seek" id="seek">
        <div class="track">
          <div class="buf" id="buf"></div>
          <div class="fill" id="fill"></div>
          <div class="knob" id="knob"></div>
        </div>
      </div>

      <div class="row">
        <button class="ibtn play" id="playBtn" title="播放 / 暂停（空格）">▶</button>
        <span class="time"><b id="cur">0:00</b><i>/</i><span id="dur">0:00</span></span>

        <span class="spacer"></span>

        <label class="pick" title="倍速">
          <select id="rate">
            <option value="0.5">0.5×</option>
            <option value="0.75">0.75×</option>
            <option value="1" selected>1×</option>
            <option value="1.25">1.25×</option>
            <option value="1.5">1.5×</option>
            <option value="1.75">1.75×</option>
            <option value="2">2×</option>
            <option value="2.5">2.5×</option>
            <option value="3">3×</option>
          </select>
        </label>

        <button class="ibtn" id="fsBtn" title="全屏">⛶</button>
      </div>
    </footer>

    <div class="opts" id="opts">
      <div class="grp">
        <span class="lbl">屏幕</span>
        <span class="seg" id="segCount">
          <button data-count="1" class="on">1</button>
          <button data-count="2">2</button>
        </span>
      </div>

      <div class="grp" id="posGrp">
        <span class="lbl">位置</span>
        <span class="seg" id="segMode">
          <button data-mode="side" class="on">左右</button>
          <button data-mode="stack">上下</button>
          <button data-mode="pip">小窗</button>
        </span>
        <span class="seg" id="segPip" hidden>
          <button data-pip="1">① 小窗</button>
          <button data-pip="2">② 小窗</button>
        </span>
        <span class="hint" id="pipHint" hidden>（可拖动）</span>
      </div>

      <div class="grp" id="syncGrp">
        <label class="chk"><input type="checkbox" id="syncOn"> 时轴同步</label>
        <span class="off" id="offBox">
          <button class="mini" id="offM" title="把第二路再往后 0.1 秒">−</button>
          <input id="off" type="range" min="-20" max="20" step="0.1" value="0">
          <button class="mini" id="offP" title="把第二路再往前 0.1 秒">+</button>
          <b id="offv">0.0s</b>
        </span>
        <button class="mini" id="off0" title="时间差归零">归零</button>
      </div>

      <div class="grp grow">
        <span class="lbl">音量</span>
        <span class="ach">
          <i>①</i>
          <button class="mini" id="mute1" title="静音第一路">🔊</button>
          <input class="vrange" id="vol1" type="range" min="0" max="1" step="0.01" value="1">
        </span>
        <span class="ach" id="ach2" hidden>
          <i>②</i>
          <button class="mini" id="mute2" title="静音第二路">🔇</button>
          <input class="vrange" id="vol2" type="range" min="0" max="1" step="0.01" value="0">
        </span>
      </div>
    </div>
  </div>

  <aside class="side" id="side" hidden>
    <div class="tabs" id="tabs">
      <button data-tab="sum" class="on">概要</button>
      <button data-tab="points">知识要点</button>
      <button data-tab="ppt">PPT 帧</button>
      <button data-tab="sub">字幕</button>
    </div>
    <div class="pane" id="pane"></div>
  </aside>

</div>

<script src="../ext/bridge.js"></script>
<script src="player.js"></script>
<script src="side.js"></script>
</body>
</html>
